name: Build ESL Software Native Android APK & Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Backup Custom App Code
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp lib/main.dart /tmp/main.dart.bak

      - name: Generate Android Platform Files
        run: |
          rm -rf android test
          flutter create . --org com.dishugrewal --project-name esl_software_app --platforms=android

      - name: Restore Custom App Code
        run: |
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/main.dart.bak lib/main.dart
          rm -rf test

      - name: Inject Bluetooth & Internet Permissions Safely via Python
        run: |
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          """
          content = content.replace("<application", perms + "\n    <application android:usesCleartextTraffic=\"true\"")
          content = content.replace("android:label=\"esl_software_app\"", "android:label=\"ESL Software\"")
          with open(manifest_path, "w") as f:
              f.write(content)
          '

      - name: Set minSdkVersion to 21
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Native Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESL-Software-Native-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows_native_app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Backup Custom App Code
        shell: cmd
        run: |
          copy pubspec.yaml ..\pubspec.yaml.bak
          copy lib\main.dart ..\main.dart.bak

      - name: Generate Windows Platform Files
        shell: cmd
        run: |
          if exist test rmdir /s /q test
          flutter create . --org com.dishugrewal --project-name esl_software_app --platforms=windows

      - name: Restore Custom App Code
        shell: cmd
        run: |
          copy /Y ..\pubspec.yaml.bak pubspec.yaml
          copy /Y ..\main.dart.bak lib\main.dart
          if exist test rmdir /s /q test

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Native Windows Desktop App
        run: flutter build windows --release --no-tree-shake-icons

      - name: Upload Native Windows Desktop App
        uses: actions/upload-artifact@v4
        with:
          name: ESL-Software-Native-Windows-App
          path: build/windows/x64/runner/Release/
